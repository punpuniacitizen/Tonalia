[workspace]
resolver = "3"
members = ["src-tauri", "crates/tonalia-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
midly = "0.5"
tonalia-core = { path = "crates/tonalia-core" }

# Guía de optimización: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# El audio necesita rendimiento incluso en modo desarrollo: optimizamos las dependencias.
[profile.dev.package."*"]
opt-level = 2
