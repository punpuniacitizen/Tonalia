[package]
name = "tonalia"
version.workspace = true
description = "Tonalia: composición armónica visual y educativa"
authors = ["nocom"]
edition.workspace = true

[lib]
# El sufijo `_lib` evita un choque de nombres entre la lib y el binario en Windows.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "tonalia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tonalia-core.workspace = true
cpal = "0.18.2"
rtrb = "0.4.0"
